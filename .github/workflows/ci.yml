name: Build and validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PrimeJSON.sln --configuration Release
      - run: dotnet run --project tests/PrimeJSON.Tests --configuration Release --no-build
      - run: dotnet run --project examples/PrimeJSON.Examples --configuration Release --no-build
      - run: dotnet pack PrimeJSON/PrimeJSON.csproj --configuration Release --no-build --output artifacts
